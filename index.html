<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>吞嚥照護本</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#201e1b;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
  :root{
    --page-bg:#1e1b18; --bg:#fef6ee; --card:#ffffff; --ink:#1c1c1c; --sub:#6b7280;
    --accent:#f6812a; --accent-d:#d6620f; --yellow:#fddb00; --yellow-d:#f5c400;
    --line:#e5e7eb; --teal:#12b8a6; --gold:#eab308;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(135deg, #1f1c19 0%, #2b2520 50%, #171412 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;color:var(--ink);}
  
  /* ---- Showcase Header Bar ---- */
  .showcase-header{width:100%;max-width:440px;margin-bottom:14px;background:rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:10px 14px;color:#fff;box-shadow:0 8px 32px rgba(0,0,0,.3);}
  .sc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .sc-title{font-size:.85rem;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:6px;color:#ffdd99;}
  .sc-badge{background:rgba(246,129,42,.25);border:1px solid var(--accent);color:#ffaa5e;font-size:.65rem;padding:2px 8px;border-radius:10px;font-weight:700;}
  .sc-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
  .sc-btn{flex:0 0 auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:#eee;font-size:.72rem;padding:5px 10px;border-radius:12px;cursor:pointer;transition:all .2s;font-weight:600;}
  .sc-btn:hover,.sc-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(246,129,42,.4);}

  /* ---- Phone Device Mockup ---- */
  .phone{width:390px;max-width:100%;height:844px;background:var(--bg);border-radius:44px;box-shadow:0 25px 60px rgba(0,0,0,.6),0 0 0 10px #1c1917,0 0 0 12px rgba(255,255,255,.15);overflow:hidden;position:relative;}
  .phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:30px;background:#1c1917;border-radius:0 0 20px 20px;z-index:50;display:flex;align-items:center;justify-content:center;}
  .notch-cam{width:12px;height:12px;border-radius:50%;background:#09090b;margin-left:auto;margin-right:24px;border:1px solid rgba(255,255,255,.1);}
  .phone-bar{position:absolute;top:8px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center;font-size:.72rem;font-weight:700;color:#1c1c1c;z-index:49;pointer-events:none;}
  .phone-bar.dark-text{color:#222;}
  .phone-bar.light-text{color:#fff;}

  .screen{height:100%;overflow-y:auto;padding-bottom:96px;position:relative;-webkit-overflow-scrolling:touch;}
  .tabbar{position:absolute;bottom:0;left:0;right:0;height:88px;background:#171717;display:flex;align-items:flex-end;padding-bottom:14px;border-radius:36px 36px 0 0;z-index:20;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:.68rem;color:#fff;cursor:pointer;background:none;border:none;}
  .tab.active{color:var(--accent);}
  .tab.active .ic svg{stroke:var(--accent);}
  .tab .ic{display:flex;align-items:center;justify-content:center;}
  .tab .ic svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.6;}
  .tab-spacer{flex:0 0 76px;}
  .tab-bump{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:140px;height:48px;background:#171717;border-radius:70px 70px 0 0;z-index:19;}
  .fab{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;font-size:1.7rem;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:21;box-shadow:0 4px 12px rgba(246,129,42,.5);transition:transform .2s;}
  .fab:hover{transform:translateX(-50%) scale(1.06);}

  /* ---- 💌 開場邀請函動畫 (Invitation Animation) ---- */
  .inv-container{position:relative;min-height:100%;background:linear-gradient(165deg,#fff8ee 0%,#fde8ce 40%,#f8cfa5 100%);padding:44px 20px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;perspective:1000px;}
  .inv-sparkles{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(246,129,42,.15) 1.5px,transparent 1.5px),radial-gradient(circle,rgba(253,219,0,.2) 1.5px,transparent 1.5px);background-size:24px 24px,36px 36px;background-position:0 0,12px 12px;pointer-events:none;}
  .inv-glow{position:absolute;top:20%;left:50%;transform:translate(-50%,-50%);width:320px;height:320px;background:radial-gradient(circle,rgba(255,200,100,.45) 0%,rgba(255,255,255,0) 70%);border-radius:50%;filter:blur(30px);pointer-events:none;}
  
  .inv-hero{text-align:center;margin-bottom:20px;z-index:2;animation:fadeInDown .8s ease forwards;}
  .inv-tag{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid rgba(246,129,42,.3);color:var(--accent-d);font-size:.75rem;font-weight:800;padding:5px 14px;border-radius:30px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:10px;}
  .inv-hero h1{margin:0 0 4px;font-size:1.45rem;font-weight:900;color:#2c2014;letter-spacing:.3px;}
  .inv-hero p{margin:0;font-size:.82rem;color:#7c6248;}

  /* 3D Envelope Component */
  .env-stage{position:relative;width:320px;height:220px;margin-bottom:24px;z-index:5;perspective:1000px;cursor:pointer;}
  .env-body{position:absolute;inset:0;background:linear-gradient(145deg,#fcf7ee 0%,#f0dfc8 100%);border-radius:18px;border:2px solid #dfcaa8;box-shadow:0 15px 35px rgba(138,97,66,.25),inset 0 1px 0 #fff;z-index:2;overflow:visible;}
  .env-pocket{position:absolute;left:0;right:0;bottom:0;height:140px;background:linear-gradient(180deg,#eedbbf 0%,#e4cdad 100%);border-radius:0 0 16px 16px;clip-path:polygon(0% 25%, 50% 100%, 100% 25%, 100% 100%, 0% 100%);z-index:4;box-shadow:inset 0 2px 4px rgba(0,0,0,.04);}
  .env-flap{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,#e8d0ae 0%,#f5e5ce 100%);border-radius:16px 16px 0 0;clip-path:polygon(0% 0%, 100% 0%, 50% 100%);transform-origin:top center;transition:transform .8s cubic-bezier(.4,0,.2,1);z-index:6;box-shadow:0 3px 8px rgba(0,0,0,.1);}
  .env-stage.open .env-flap{transform:rotateX(180deg);z-index:1;}

  /* Wax Seal */
  .wax-seal{position:absolute;left:50%;top:95px;transform:translate(-50%,-50%);width:58px;height:58px;background:radial-gradient(circle,#e63946 0%,#b71c1c 70%,#7f0000 100%);border-radius:50%;border:2px solid #ffccd5;box-shadow:0 6px 16px rgba(183,28,28,.45),inset 0 2px 4px rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:1.4rem;z-index:7;transition:all .3s cubic-bezier(.175,.885,.32,1.275);animation:sealPulse 2s infinite;}
  .wax-seal span{font-size:.58rem;font-weight:800;letter-spacing:.5px;margin-top:-2px;color:#ffebee;}
  .env-stage:hover .wax-seal{transform:translate(-50%,-50%) scale(1.12);box-shadow:0 8px 22px rgba(183,28,28,.6);}
  .env-stage.open .wax-seal{opacity:0;transform:translate(-50%,-50%) scale(0);pointer-events:none;}

  @keyframes sealPulse{
    0%,100%{box-shadow:0 6px 16px rgba(183,28,28,.45),0 0 0 0 rgba(230,57,70,.4);}
    50%{box-shadow:0 8px 20px rgba(183,28,28,.55),0 0 0 10px rgba(230,57,70,0);}
  }

  /* Unfolded Invitation Letter */
  .inv-letter-card{width:100%;max-width:340px;background:#ffffff;border-radius:24px;padding:24px 20px 20px;box-shadow:0 12px 36px rgba(100,70,40,.18),0 1px 3px rgba(0,0,0,.05);border:1px solid #faeade;position:relative;z-index:10;transform:translateY(30px);opacity:0;transition:all .8s cubic-bezier(.16,1,.3,1);display:none;}
  .inv-stage-opened .inv-letter-card{display:block;transform:translateY(0);opacity:1;animation:slideUpCard .7s ease forwards;}
  .inv-stage-opened .env-stage{display:none;}
  .inv-stage-opened .inv-hero{display:none;}

  .letter-stamp{position:absolute;right:18px;top:18px;width:44px;height:44px;border:1.5px dashed #f6812a;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f6812a;font-size:.6rem;font-weight:800;transform:rotate(6deg);}
  .letter-stamp b{font-size:.9rem;}
  .letter-to{font-size:.78rem;font-weight:800;color:#f6812a;margin-bottom:6px;display:flex;align-items:center;gap:4px;}
  .letter-heading{font-size:1.15rem;font-weight:900;color:#1c1c1c;margin:0 0 12px;line-height:1.35;}
  .letter-body{font-size:.82rem;color:#4b453e;line-height:1.65;background:#fdf9f4;border-radius:14px;padding:12px 14px;margin-bottom:14px;border-left:3px solid #f6812a;}
  
  .team-section{margin-bottom:16px;}
  .team-title{font-size:.74rem;font-weight:800;color:#8a7765;margin-bottom:8px;}
  .team-pills{display:flex;flex-direction:column;gap:6px;}
  .team-pill{display:flex;align-items:center;gap:8px;background:#f7f6f3;padding:7px 10px;border-radius:12px;}
  .team-pill .tp-av{font-size:1.1rem;}
  .team-pill .tp-nm{font-size:.78rem;font-weight:700;color:#222;}
  .team-pill .tp-role{font-size:.68rem;color:#888;margin-left:auto;}
  .team-pill.founder{background:#fff3e8;border:1px solid #ffd8b8;}
  .team-pill.founder .tp-role{color:#e75900;font-weight:700;}

  .target-badge{background:linear-gradient(135deg,#fff600 0%,#ffd700 100%);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;box-shadow:0 2px 8px rgba(218,165,32,.25);}
  .tb-left b{display:block;font-size:.84rem;color:#3d3400;font-weight:900;}
  .tb-left span{display:block;font-size:.68rem;color:#6b5c00;}
  .tb-icon{font-size:1.6rem;}

  .inv-actions{display:flex;flex-direction:column;gap:8px;}
  .btn-accept{background:linear-gradient(135deg,#f6812a 0%,#e75900 100%);color:#fff;border:none;padding:13px 20px;border-radius:18px;font-size:.92rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(246,129,42,.4);transition:all .2s;}
  .btn-accept:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(246,129,42,.5);}
  .btn-replay{background:none;border:1px solid #ddd;color:#777;padding:9px;border-radius:14px;font-size:.76rem;cursor:pointer;font-weight:700;}
  .btn-replay:hover{background:#f5f5f5;color:#333;}

  @keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideUpCard{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

  /* ---- 質地卡 ---- */
  .qd-head{padding:16px 16px 10px;}
  .qd-head .tag{color:var(--accent);font-size:.68rem;font-weight:700;margin-bottom:6px;}
  .qd-head h2{margin:0 0 2px;font-size:1.05rem;color:var(--ink);}
  .qd-head p{margin:0;font-size:.78rem;color:var(--sub);}
  .qd-section-title{padding:14px 16px 0;font-size:.95rem;font-weight:700;color:var(--ink);}
  .qd-section-sub{padding:2px 16px 0;font-size:.75rem;color:var(--sub);}
  .split-card{display:flex;height:200px;border-radius:18px;overflow:hidden;margin:10px 16px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .split-half{flex:1;position:relative;cursor:pointer;display:flex;align-items:flex-end;padding:14px;border:none;text-align:left;font:inherit;}
  .split-half .lbl{color:#fff;font-weight:800;font-size:1.02rem;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  .split-video-a{background:linear-gradient(160deg,#c8946a 0%,#8a6142 100%);}
  .split-video-b{background:linear-gradient(160deg,#8a6142 0%,#4a3222 100%);}
  .split-menu-a{background:linear-gradient(160deg,#d8cda0 0%,#b7ae85 100%);}
  .split-menu-b{background:linear-gradient(160deg,#b7ae85 0%,#6f7050 100%);}
  .split-menu-a .lbl,.split-menu-b .lbl{color:#2c2a1e;text-shadow:none;}
  .qd-scroll{display:flex;gap:10px;overflow-x:auto;padding:10px 16px 4px;-webkit-overflow-scrolling:touch;}
  .qd-card{flex:0 0 128px;height:158px;border-radius:24px;position:relative;overflow:hidden;cursor:pointer;border:none;padding:0;display:block;}
  .qd-card .qd-bg{position:absolute;inset:0;}
  .qd-card .qd-overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(255,255,255,.15) 0%, rgba(0,0,0,.55) 100%);}
  .qd-card .qd-lbl{position:absolute;left:0;right:0;bottom:14px;z-index:1;color:#fff;text-align:center;padding:0 6px;}
  .qd-card .qd-lbl b{display:block;font-size:1.05rem;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.4);}
  .qd-card .qd-lbl span{display:block;font-size:.66rem;margin-top:2px;text-shadow:0 1px 4px rgba(0,0,0,.4);}
  .qd-toolkit{display:flex;gap:10px;padding:14px 16px 20px;}
  .qd-toolkit .qd-tk-card{flex:1;height:200px;border-radius:24px;background:linear-gradient(160deg,#f3ead9 0%,#d9c9a4 100%);display:flex;align-items:center;justify-content:center;font-size:2rem;color:#a98a55;}

  /* ---- 質地測定示範 detail page ---- */
  .st-topbar{background:#e75900;color:#fff;padding:20px 16px 18px;position:relative;border-radius:0 0 30px 30px;}
  .st-back{position:absolute;left:16px;top:18px;background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;padding:4px 8px;}
  .st-topbar h2{margin:0 0 10px;text-align:center;font-size:1rem;font-weight:800;}
  .st-warn{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.68rem;font-weight:700;}
  .st-pillrow{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;}
  .st-pill{flex:0 0 auto;border:1.5px solid var(--accent);color:var(--accent);border-radius:20px;padding:8px 16px;font-size:.82rem;font-weight:700;background:var(--card);cursor:pointer;white-space:nowrap;}
  .st-pill.active{background:var(--accent);color:#fff;}
  .st-section{background:var(--card);border-radius:16px;margin:0 16px 16px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .st-section h3{margin:0 0 4px;font-size:.9rem;color:var(--accent);}
  .st-section .exp{font-size:.78rem;color:var(--sub);margin:0 0 10px;}
  .st-video-label{font-size:.82rem;font-weight:700;margin:12px 0 6px;color:var(--ink);}
  .st-video-label:first-of-type{margin-top:0;}
  .st-video{width:100%;aspect-ratio:16/9;border-radius:12px;background:linear-gradient(160deg,#e7dcc8 0%,#c9a876 100%);display:flex;align-items:center;justify-content:center;color:#777;font-size:.75rem;overflow:hidden;position:relative;}
  .st-video iframe{width:100%;height:100%;border:none;border-radius:12px;}
  .credits-footer{margin:24px 0 0;background:#e75900;border-radius:30px 30px 0 0;padding:20px 24px 28px 24px;color:#fff;position:relative;}
  .credits-footer .cf-title{font-size:.75rem;font-weight:700;margin:0 0 12px;line-height:1.5;text-align:center;}
  .credits-row{display:flex;align-items:flex-start;gap:8px;font-size:.75rem;font-weight:700;line-height:1.5;margin-bottom:4px;}
  .credits-row .bar{width:4px;flex:0 0 4px;align-self:stretch;min-height:16px;background:#fff;border-radius:1px;}
  .cf-badge{position:absolute;right:16px;bottom:12px;width:32px;height:32px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;overflow:hidden;}
  .st-video-link{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;height:100%;text-decoration:none;}
  .st-video-link .play-badge{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--accent-d);display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 2px 8px rgba(0,0,0,.2);}
  .st-video-link .yt-caption{font-size:.72rem;font-weight:700;color:#5a4326;}

  /* ---- 示範料理 detail page ---- */
  .mn-info{font-size:.68rem;text-align:center;opacity:.9;margin-bottom:4px;}
  .mn-nutri{font-size:.66rem;text-align:center;opacity:.85;}
  .mn-intro{background:var(--card);border-radius:16px;margin:0 16px 16px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:.78rem;color:var(--sub);line-height:1.7;}
  .mn-intro h3{margin:0 0 8px;font-size:.9rem;color:var(--ink);}
  .mn-ing{font-size:.76rem;color:var(--sub);margin:0 0 10px;}
  .mn-photo{width:100%;height:160px;border-radius:14px;background:#e5e5e5;}
  .mn-warn{font-size:.7rem;color:var(--accent);margin:0 0 8px;line-height:1.5;}

  /* ---- 自家菜 / 安心錄 shared ---- */
  .yellow-panel{background:var(--yellow);padding:14px 16px 16px;}
  .yp-row{display:flex;justify-content:space-between;align-items:center;}
  .pill-white{background:#fff;border-radius:20px;padding:6px 12px;font-size:.72rem;font-weight:700;color:#222;display:inline-flex;align-items:center;gap:5px;}
  .avatar{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;overflow:hidden;}
  .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;}
  .cal-h{text-align:center;font-size:.62rem;color:#8a6d00;}
  .cal-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:.75rem;cursor:pointer;border:none;background:transparent;color:#333;}
  .cal-d.sel{background:#fff;font-weight:800;}
  .cal-d.has::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--accent);position:relative;top:9px;}
  .today-title{font-weight:800;font-size:1rem;margin:12px 0 2px;color:#222;}
  .today-sub{font-size:.78rem;color:#3a3226;}
  .entry-item{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.75);border-radius:12px;padding:9px 12px;margin-top:8px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .entry-item .entry-badge{width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 1px 3px rgba(0,0,0,.08);flex-shrink:0;}
  .entry-item .who{font-size:.7rem;font-weight:700;color:#222;}
  .entry-item .what{font-size:.74rem;color:#444;font-weight:600;}
  .entry-item .time{margin-left:auto;font-size:.65rem;color:#666;font-weight:600;}

  .form-panel{background:var(--card);border-radius:20px 20px 0 0;margin-top:-14px;position:relative;padding:16px;box-shadow:0 -2px 10px rgba(0,0,0,.08);}
  .fp-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .fp-head .dsel{font-weight:800;font-size:1rem;color:var(--ink);}
  .seg{display:flex;background:var(--line);border-radius:14px;padding:2px;font-size:.7rem;margin-left:auto;}
  .seg span{padding:5px 10px;border-radius:12px;cursor:pointer;color:var(--ink);}
  .seg span.on{background:var(--teal);color:#fff;font-weight:700;}
  .cam-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .f-field{border:1.5px solid var(--accent);border-radius:22px;padding:9px 14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .f-field label{color:var(--accent);font-size:.8rem;font-weight:700;flex-shrink:0;}
  .f-field input,.f-field select{border:none;outline:none;flex:1;font-size:.85rem;background:transparent;color:var(--ink);text-align:right;min-width:0;}
  .f-field .icon-r{font-size:1rem;flex-shrink:0;}
  .btn-primary{background:var(--accent);color:#fff;border:none;padding:11px;border-radius:14px;font-size:.86rem;font-weight:700;cursor:pointer;width:100%;}
  .list-title{font-size:.9rem;font-weight:700;margin:16px 0 8px;color:var(--ink);}
  .empty{text-align:center;color:var(--sub);font-size:.82rem;padding:24px 0;}

  /* ---- 安心錄 last visit ---- */
  .visit-hero{background:var(--yellow);border-radius:16px;padding:14px 16px;margin:0 16px;box-shadow:0 4px 0 var(--yellow-d);}

  allMeals.forEach(m=>{ (byDate[m.date]=byDate[m.date]||[]).push(m); });
  const dates = Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).slice(0,2);
  const cardDates = dates.length? dates : [fmt(d)];
  const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  return `
  <div class="home-hero">
    <div class="home-toprow">陳寶珠的吞嚥照護本 <span class="chev">▾</span></div>
    <div class="home-date">${dateStr}</div>
    <div class="home-greet">早安！阿嬤今天吃飯了嗎？</div>
    <div class="home-cta">
      <button class="meal" data-goto="home-meal">＋ 餐食紀錄</button>
      <button class="visit" data-goto="home-visit">＋ 診斷回顧</button>
    </div>
    <div class="home-level">
      <div class="lv-lbl">寶珠阿嬤可以吃</div>
      <div class="lv-num">Level 4</div>
      <div class="lv-tail">以下</div>
      <div class="lv-bowl">🍲</div>
    </div>
  </div>
  <div class="home-logs">
    ${cardDates.map((dt,i)=>{
      const items = byDate[dt]||[];
      const dobj = new Date(dt+"T00:00:00");
      const rows = items.length
        ? items.slice(0,3).map(it=>`<div class="log-row">🍽 ${it.name}</div>`)
        : (i===0
            ? [`<div class="log-row">🍚 地瓜粥</div>`,`<div class="log-row">💧 1200ml</div>`,`<div class="log-row">🕒 早餐、午餐</div>`]
            : [`<div class="log-row">🍚 南瓜燉飯</div>`,`<div class="log-row">💧 950ml</div>`]);
      return `
      <div class="log-card ${i===0?"current":"past"}">
        <div class="log-date"><div class="dn">${String(dobj.getDate()).padStart(2,"0")}</div><div class="dm">${MON[dobj.getMonth()]}</div></div>
        <div class="log-rows">
          ${i===0? `<div class="log-badge">回診日</div>` : ""}
          ${rows.join("")}
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

    : `background:${item.grad};`;
  return `
  <button class="qd-card" style="${bg}" data-goto="${goto}" data-key="${item.key}">

    <div class="qd-lbl"><b>${item.label}</b><span>${item.sub}</span></div>

function renderMiniCalendar(selectedDate, allMeals){
  const days = ["MO","TU","WE","TH","FR","SA","SU"];
  const y = selectedDate.getFullYear(), m = selectedDate.getMonth();
  const first = new Date(y,m,1);
  let startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let dd=1; dd<=daysInMonth; dd++) cells.push(dd);
  const hasSet = new Set(allMeals.map(mm=>mm.date));
  let html = `<div class="calendar">`;
  days.forEach(dh=> html += `<div class="cal-h">${dh}</div>`);
  cells.forEach(dd=>{
    if(dd===null){ html += `<div></div>`; return; }
    const dateStr = fmt(new Date(y,m,dd));
    const isSel = dateStr===state.mealSelDate;
    const has = hasSet.has(dateStr);
    html += `<button class="cal-d ${isSel?"sel":""} ${has?"has":""}" data-date="${dateStr}">${dd}</button>`;
  });
  html += `</div>`;
  return html;
}

/* ---------------- events ---------------- */
function wireEvents(){
  // Wax Seal click to open envelope with smooth animation
  const envStage = document.getElementById("envelopeStage");
  const waxBtn = document.getElementById("waxSealBtn");
  if(envStage && !state.invitationOpen){
    const openHandler = ()=>{
      envStage.classList.add("open");
      setTimeout(()=>{
        state.invitationOpen = true;
        render();
      }, 700);
    };
    envStage.addEventListener("click", openHandler);
    if(waxBtn) waxBtn.addEventListener("click", (e)=>{ e.stopPropagation(); openHandler(); });
  }

  // Accept Invitation button -> enter Onboarding or Home
  const btnAccept = document.getElementById("btnAcceptInvitation");
  if(btnAccept){
    btnAccept.addEventListener("click", ()=>{
      let onboarded = false;
      try{ onboarded = !!localStorage.getItem(ONBOARD_KEY); }catch(e){}
      state.tab = onboarded ? "home" : "onboard";
      state.textureView = "list";
      render();
      toast("✨ 歡迎加入陳寶珠奶奶的照護團隊！");
    });
  }

  // Replay Invitation Animation
  const btnReplay = document.getElementById("btnReplayInvitation");
  if(btnReplay){
    btnReplay.addEventListener("click", ()=>{
      state.invitationOpen = false;
      render();
    });
  }

  // Calendar date selection
  document.querySelectorAll("[data-date]").forEach(b=>{
    b.addEventListener("click", ()=>{ state.mealSelDate = b.dataset.date; render(); });
  });

  // Meal record form
  const mf = document.getElementById("mealForm");
  if(mf){
    mf.addEventListener("submit", e=>{
      e.preventDefault();
      const arr = loadMeals();
      arr.push({
        id: uid(),
        date: state.mealSelDate,
        time: new Date().toTimeString().slice(0,5),
        who: document.getElementById("m_who").value.trim(),
        name: document.getElementById("m_name").value.trim(),
        cat: document.getElementById("m_cat").value,
        note: document.getElementById("m_note").value.trim()
      });
      saveMeals(arr);
      toast("已儲存飲食紀錄");
      render();
    });
  }

  // Visit doctor record form
  const vf = document.getElementById("visitForm");
  if(vf){
    const dEl = document.getElementById("v_date");
    if(dEl && !dEl.value) dEl.value = fmt(new Date());
    vf.addEventListener("submit", e=>{
      e.preventDefault();
      const arr = loadVisits();
      arr.push({
        id: uid(),
        date: document.getElementById("v_date").value,
        time: new Date().toTimeString().slice(0,5),
        clinic: document.getElementById("v_clinic").value.trim(),
        doctor: document.getElementById("v_doctor").value.trim(),
        note: document.getElementById("v_note").value.trim(),
        recorder: document.getElementById("v_recorder").value.trim()
      });
      saveVisits(arr);
      toast("已儲存看診紀錄");
      render();
    });
  }

  // Navigation shortcuts
  document.querySelectorAll("[data-goto]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const goto = el.dataset.goto;
      const key = el.dataset.key;
      if(goto==="selftest"){
        state.textureView = "selftest";
        state.selftestKey = key;
        render();
      } else if(goto==="menu"){
        state.textureView = "menu";
        state.selftestKey = key;
        render();
      } else if(goto==="home-meal"){
        state.tab = "meal"; state.textureView = "list";
        render();
      } else if(goto==="home-visit"){
        state.tab = "visit"; state.textureView = "list";
        render();
      } else {
        toast("此區塊示範用，之後可接回完整內容／影片");
      }
    });
  });

  // Onboarding next button
  const onboardNext = document.getElementById("onboardNext");
  if(onboardNext){
    onboardNext.addEventListener("click", ()=>{
      if(state.onboardStep < ONBOARD_SLIDES.length){
        state.onboardStep++;
      } else {
        try{ localStorage.setItem(ONBOARD_KEY, "1"); }catch(e){}
        state.tab = "home";
      }
      render();
    });
  }

  // Back buttons
  const backBtn = document.getElementById("stBack");
  if(backBtn){
    backBtn.addEventListener("click", ()=>{
      state.textureView = "list";
      state.selftestKey = null;
      render();
    });
  }
  const mnBackBtn = document.getElementById("mnBack");
  if(mnBackBtn){
    mnBackBtn.addEventListener("click", ()=>{
      state.textureView = "list";
      state.selftestKey = null;
      render();
    });
  }

  // Category anchor pills
  document.querySelectorAll(".st-pill").forEach(p=>{
    p.addEventListener("click", ()=>{
      document.querySelectorAll(".st-pill").forEach(x=>x.classList.remove("active"));
      p.classList.add("active");
      const target = document.getElementById(p.dataset.anchor);
      if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
}

  b.addEventListener("click", ()=>{
    state.tab = b.dataset.tab;
    state.textureView = "list";
    state.selftestKey = null;

      state.textureView = "list";
    } else if(sc === "elder"){
      state.tab = "elder";
      state.textureView = "list";
    }
    render();
  });
});

start();
